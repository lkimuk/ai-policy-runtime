[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-policy-runtime"
version = "0.1.5"
description = "Skill DSL and policy runtime for Codex, Claude Code, OpenCode, and other AI agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
semantic = [
    "huggingface-hub>=0.23",
    "sentence-transformers>=2.7",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.10",
]

[project.scripts]
ai-policy-runtime = "ai_policy_runtime.interfaces.cli:main"
policy-codex = "ai_policy_runtime.interfaces.codex:main"
policy-claude = "ai_policy_runtime.interfaces.claude:main"
policy-opencode = "ai_policy_runtime.interfaces.opencode:main"

[tool.setuptools.packages.find]
include = ["ai_policy_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
